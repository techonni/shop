<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bauhaus Bundle · Techonni</title>
<meta name="description" content="All 17 Bauhaus prints. Print-ready JPEGs built to hang at 50 × 70 cm. €99." />
<link rel="canonical" href="https://shop.techonni.com/prints/bundle/" />
<link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="../../hub.css?v=15" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
<header class="site-header">
  <div class="shop-col header-inner">
    <a href="https://www.techonni.com/" class="logo-link" aria-label="Techonni home"><svg class="logo-mark" width="28" height="28" viewBox="0 0 40 40" fill="none" aria-hidden="true"><circle cx="20" cy="8" r="2.2" fill="currentColor"/><circle cx="28.5" cy="11.5" r="2.2" fill="currentColor"/><circle cx="32" cy="20" r="2.2" fill="currentColor"/><circle cx="28.5" cy="28.5" r="2.2" fill="currentColor"/><circle cx="20" cy="32" r="2.2" fill="currentColor"/><circle cx="11.5" cy="28.5" r="2.2" fill="currentColor"/><circle cx="8" cy="20" r="2.2" fill="currentColor"/><circle cx="11.5" cy="11.5" r="2.2" fill="currentColor"/><circle cx="20" cy="20" r="2.6" fill="currentColor"/></svg></a>
    <nav class="header-nav">
      <a href="../../" class="nav-link">Shop</a><a href="../../buy-reel/" class="nav-link">Buy reel</a>
      </nav>
  </div>
</header>
<main class="flex-1">
  <div class="shop-col page">
    <p class="section-label"><a href="../../">Prints</a></p>
    <div class="product-row">
      <figure class="print-plate"><img class="print-shot" src="../Bauhaus_Print_01.jpg" alt="Bauhaus Bundle" /></figure>
      <div class="product-copy">
        <p class="section-label">Full set — 17 prints</p>
        <h1 class="page-title">Bauhaus Bundle</h1>
        <p class="price">€99</p>
        <p class="page-lead">All 17 print-ready JPEGs. Built to hang at 50 × 70 cm. One checkout. One zip.</p>
        <p id="actions"></p>
      </div>
    </div>
    <section class="section">
      <h2 class="section-title">In the set</h2>
      <ul class="print-grid" id="set"></ul>
    </section>
  </div>
</main>
<footer class="site-footer"><div class="shop-col footer-inner"><div class="social-pills"><a class="pill" href="https://x.com/techonni" target="_blank" rel="noopener noreferrer">X</a></div><p class="copyright">© 2026 Techonni</p></div></footer>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
(function () {
  var n, pad, file, href, html = "";
  for (n = 1; n <= 17; n++) {
    pad = n < 10 ? "0" + n : "" + n;
    file = "Bauhaus_Print_" + pad + ".jpg";
    href = n < 10 ? "../bauhaus-print-0" + n + "/" : "../bauhaus-print-" + n + "/";
    html += '<li><a class="print-card" href="' + href + '"><figure class="print-plate"><img class="print-shot" src="../' + file + '" alt="Bauhaus ' + pad + '" /></figure><p class="print-name">Bauhaus ' + pad + '</p><p class="print-meta">€14.95</p></a></li>';
  }
  document.getElementById("set").innerHTML = html;
  var paid = /[?&]paid=1\b/.test(location.search);
  var box = document.getElementById("actions");
  if (!paid) {
    box.innerHTML = '<a class="buy" href="https://shop-nu-ten-29.vercel.app/api/checkout?sku=bauhaus-bundle">Get the set</a>';
    return;
  }
  box.innerHTML = '<a class="buy" href="#" id="zip-btn">Download zip</a><p class="page-lead" id="zip-note">Payment received. One file, 17 prints.</p>';
  document.getElementById("zip-btn").addEventListener("click", function (e) {
    e.preventDefault();
    var btn = this;
    var note = document.getElementById("zip-note");
    btn.textContent = "Preparing zip…";
    var zip = new JSZip();
    var jobs = [];
    for (n = 1; n <= 17; n++) {
      pad = n < 10 ? "0" + n : "" + n;
      file = "Bauhaus_Print_" + pad + ".jpg";
      jobs.push(
        fetch("../" + file).then(function (res) {
          if (!res.ok) throw new Error(res.status);
          return res.arrayBuffer();
        }).then((function (name) {
          return function (buf) { zip.file(name, buf); };
        })(file))
      );
    }
    Promise.all(jobs).then(function () {
      return zip.generateAsync({ type: "blob", compression: "DEFLATE" });
    }).then(function (blob) {
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "Bauhaus_Bundle.zip";
      a.click();
      URL.revokeObjectURL(url);
      btn.textContent = "Download zip";
      note.textContent = "Saved Bauhaus_Bundle.zip";
    }).catch(function () {
      btn.textContent = "Download zip";
      note.textContent = "Zip failed. Refresh and try again.";
    });
  });
})();
</script>
</body>
</html>
